<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Applications</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body>
    <h1 class="p-4 text-center text-3xl font-bold">Activity - Using the Math object to calculate mean values</h1>

        <div class="flex gap-4 items-center">

        </div>
       <div flex flex-col gap-4>
            <h3 class="text-xl font-bold mb-4" >Current selection:</h3>
            <div id="current-nums">
            </div>
        </div>
    </section>
<script src="script.js"></script>
