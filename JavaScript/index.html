<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic JavaScript concepts and syntax</title>
    <link href="../src/output.css" rel="stylesheet">
</head>
<body>
    <header class="p-4 bg-slate-100 border-b-2">
        <h1 class="font-bold text-3xl flex justify-center">JavaScript Practice</h1>
    </header>
    <!-- Mouse events -->
    <section class="max-w-9/10 mx-auto mt-10 p-5 shadow-md rounded-lg flex flex-col items-center">
        <h2 class="font-bold text-xl mb-10">Changing HTML content with JavaScript code</h2>
        <div class="w-full flex justify-around">
            <div class="max-w-1/3 flex-none flex flex-col gap-4 justify-around">
                <h3 class="font-bold">Click</h3>
                <button id="button" class="p-2 bg-slate-200 rounded-lg shadow-md hover:bg-slate-400">New text appears when this button is pressed</button>
                <p id="clicktext"></p>
            </div>

            <div class="max-w-1/3 flex-none flex flex-col gap-4 justify-around">
                <h3 class="font-bold">mouseover/mouseout</h3>
                <button id="button-hover" class="p-2 bg-slate-200 rounded-lg shadow-md hover:bg-slate-400">Original text</button>
                <p id="hovertext" class="flex-none"></p>
            </div>

            <div class="max-w-1/3 flex-none flex flex-col gap-4 justify-around">
                <h3 class="font-bold">Double click</h3>
                <button id="button-dbl" class="p-2 bg-slate-200 rounded-lg shadow-md hover:bg-slate-400">New text appears when this button is double clicked</button>
                <p id="dbl-clicktext"></p>
            </div>

             <div class="max-w-1/3 flex-none flex flex-col gap-4 justify-around">
                <h3 class="font-bold">Right click</h3>
                <button id="rightclk" class="p-2 bg-slate-200 text-base rounded-lg shadow-md hover:bg-slate-400">Right click</button>
                <p id="rightclicktext"></p>
            </div>
        </div>
    </section>

    <section class="max-w-9/10 mx-auto mt-10 p-5 shadow-md rounded-lg flex flex-col items-center">
        <h2 class="font-bold text-xl mb-10">Logging information to the console</h2>
        <div class="w-full flex justify-around">
            <div class="max-w-1/3 flex-none flex flex-col gap-4 justify-around">
                <button id="log" class="p-2 bg-slate-200 rounded-lg shadow-md hover:bg-slate-400">Log</button>
            </div>
        </div>
    </section>

<script src="script.js"></script>
</body>
</html>
