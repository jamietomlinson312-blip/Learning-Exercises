<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/output.css">
    <title>JavaScript DOM manipulation</title>
    <script src="https://kit.fontawesome.com/0f31ee50d3.js" crossorigin="anonymous"></script>
</head>
<body>
    <h1 class="text-3xl p-4 text-center">Basic task list application</h1>
    <div class="p-4 flex flex-col gap-4 w-128 mx-auto">
        <form class="">
            <label for="task">Task:</label><br>
            <input type="text" id="task" name="task" class="p-2 my-4 border-1 rounded-lg"><br>
        </form>
        <div class="flex gap-4">
            <button id="button" class="p-1 mr-5 text-sm bg-slate-200 rounded-lg hover:bg-cyan-200">Add Task</button>
        </div>
        <h3 class="font-bold text-xl">Current Tasks:</h3>
        <div class="flex flex-col">
            <ul id="new_list" class="flex flex-col gap-4">
            </ul>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
