<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive image gallery</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="font-IBMPlexSans">
    <header>
        <h1 class="font-bold text-2xl text-center p-4 bg-slate-200 border-b-1">Interactive image gallery</h1>
    </header>

    <!--Gallery section -->
    <section class="flex flex-col gap-4 p-4">

    <!-- Input -->
        <div class="flex gap-2 justify-between max-w-1/3 mx-auto p-2 text-sm border-1 rounded-sm">
            <label for="image">Image URL:</label>
            <input type="text" id="image" name="image" class="border-1 rounded-sm">
            <button id="img-btn" class="p-1 text-xs bg-cyan-700 text-gray-100 rounded-md shadow-md hover:bg-cyan-200 hover:text-cyan-700">Add Image</button>
        </div>
     <!-- Image Output -->
        <div id="container" class="grid grid-cols-4 gap-4">

        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
