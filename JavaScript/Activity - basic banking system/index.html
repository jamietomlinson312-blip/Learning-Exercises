<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking system</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="font-IBMPlexSans">
    <header class="flex justify-center p-10">
        <h1 class="font-bold text-3xl ">Exercise: Building a basic banking system</h1>
    </header>
<!--Account details section-->

    <main class="flex flex-col gap-4 justify-around">
        <p class="p-5 ">A basic banking application to practice creating Classes, Objects and methods.</p>
        <section class="flex flex-col gap-4 max-w-full p-5">
          <p id="summary"></p>
            <div class="flex flex-col">
                <h3 id="number" class="font-bold py-2 "></h3>
                <h3 id="holder" class="font-bold py-2"></h3>
                <h3 id="balance" class="font-bold py-2"></h3>
            </div>
            <div class="flex flex-col gap-5 items-start">
                <button id="b_deposit" class="p-2 bg-cyan-500 rounded-lg shadow-md text-cyan-50">Deposit</button>
                <button id="b_withdraw" class="p-2 bg-cyan-500 rounded-lg shadow-md text-cyan-50">Withdraw</button>
                <button id="b_balance" class="p-2 bg-cyan-500 rounded-lg shadow-md text-cyan-50">Check Balance</button>
                <button id="b_colour" class="p-2 bg-cyan-500 rounded-lg shadow-md text-cyan-50">Change Colour of 'p' elements using querySelectorAll</button>
                <p class="" id="new_balance"></p>
            </div>
        </section>
    </main>
    <script type="module" src="./index.js"></script>
</body>
</html>
