<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking system</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="font-IBMPlexSans">
    <header class="flex justify-center p-10">
        <h1 class="font-bold text-3xl ">Exercise: Building a basic banking system</h1>
    </header>
<!--Account details section-->

    <main class="flex justify-around">
        <p class="p-2 ">A basic banking application to practice creating Classes, Objects and methods.</p>
        <section class="grid grid-cols-2 gap-4 max-w-full">
            <div class="flex flex-col">
                <h3 class="font-bold p-2">Account Number:</h3>
                <h3 class="font-bold p-2">Account Holder:</h3>
                <h3 class="font-bold p-2">Balance:</h3>
            </div>

            <div>
                <p id="number" class="p-2"></p>
                <p id="holder" class="p-2"></p>
                <p id="balance" class="p-2"></p>
            </div>
            </div>
            <div class="flex flex-col gap-5 items-start">
                <button id="b_deposit" class="p-2 bg-cyan-500 rounded-lg shadow-md text-cyan-50">Deposit</button>
                <button id="b_withdraw" class="p-2 bg-cyan-500 rounded-lg shadow-md text-cyan-50">Withdraw</button>
                <button id="b_balance" class="p-2 bg-cyan-500 rounded-lg shadow-md text-cyan-50">Check Balance</button>
                <p id="new_balance"></p>
            </div>
        </section>
    </main>
    <script type="module" src="./index.js"></script>
</body>
</html>
